version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./saves_data:/app/saves_data
    environment:
      - DATABASE_URL=postgresql://ppsspp:secretpassword@db:5432/ppsspp_cloud
      - SECRET_KEY=super_secret_jwt_key_change_me
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ppsspp
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: ppsspp_cloud
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ppsspp.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata:
